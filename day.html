<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>당일 운영 | 체육대회 참가신청명단</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="day-ui">
    <header class="site-header admin-header day-header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="header-badge" id="day-badge">운영</span>
          <h1 class="header-title" id="day-title">체육대회 당일 운영</h1>
          <p class="header-subtitle" id="day-subtitle"></p>
        </div>
        <div class="day-header-actions">
          <button class="btn btn-ghost btn-sm" id="day-judge-open">심판</button>
        </div>
      </div>
    </header>

    <main class="day-container">
      <section class="stats-row day-stats" id="day-stats-row">
        <div class="stat-card">
          <span class="stat-value" id="day-stat-classes">-</span>
          <span class="stat-label">신청 학급</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="day-stat-events">-</span>
          <span class="stat-label">참가 종목</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="day-stat-participants">-</span>
          <span class="stat-label">참가 인원</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="day-stat-updated">-</span>
          <span class="stat-label">최근 갱신</span>
        </div>
      </section>

      <section class="card filter-card day-control-panel">
        <div class="day-tabs" role="tablist" aria-label="운영 화면 보기">
          <button class="btn btn-primary btn-sm" id="day-tab-events" data-view="events">종목별 소집</button>
          <button class="btn btn-secondary btn-sm" id="day-tab-students" data-view="students">학생 확인</button>
          <button class="btn btn-secondary btn-sm" id="day-tab-judge" data-view="judge">심판 입력</button>
        </div>

        <div class="filter-row day-filter-row">
          <div class="field-group day-event-filter-field" id="day-event-filter-field">
            <label for="day-filter-event">종목</label>
            <select id="day-filter-event">
              <option value="">전체</option>
            </select>
          </div>
          <div class="field-group">
            <label for="day-filter-grade">학년</label>
            <select id="day-filter-grade">
              <option value="">전체</option>
            </select>
          </div>
          <div class="field-group">
            <label for="day-filter-class">반</label>
            <select id="day-filter-class">
              <option value="">전체</option>
            </select>
          </div>
          <div class="field-group">
            <label for="day-filter-search">검색</label>
            <input type="text" id="day-filter-search" placeholder="학생, 학급, 종목" />
          </div>
        </div>

        <div class="filter-actions">
          <button class="btn btn-secondary btn-sm" id="day-refresh-btn">새로고침</button>
          <button class="btn btn-outline btn-sm" id="day-print-btn">인쇄</button>
          <button class="btn btn-success btn-sm" id="day-export-btn">CSV 내보내기</button>
          <span class="count-badge" id="day-count-badge"></span>
        </div>
      </section>

      <div id="day-alert" class="alert alert-error hidden"></div>

      <section id="day-view-events">
        <div class="day-event-nav" id="day-event-nav"></div>
        <div id="day-event-cards"></div>
      </section>

      <section id="day-view-students" class="hidden">
        <div class="card day-table-card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>학생</th>
                  <th>성별</th>
                  <th>학급</th>
                  <th>종목</th>
                  <th>역할/조</th>
                </tr>
              </thead>
              <tbody id="day-student-body"></tbody>
            </table>
            <div id="day-student-empty" class="table-empty hidden">표시할 참가자가 없습니다.</div>
          </div>
        </div>
      </section>

      <section id="day-view-judge" class="hidden">
        <div class="card judge-card">
          <div class="judge-head">
            <div>
              <div class="card-label">심판 입력</div>
              <h2 class="day-event-title">경기 기록 및 점수 계산</h2>
              <p class="card-subtitle" id="judge-session-label">심판 로그인이 필요합니다.</p>
            </div>
            <button class="btn btn-outline btn-sm" id="judge-logout-btn">심판 로그아웃</button>
          </div>

          <div class="judge-grade-tabs" id="judge-grade-tabs" role="tablist" aria-label="점수 입력 학년"></div>

          <div class="filter-row judge-form-grid">
            <div class="field-group">
              <label for="judge-event">종목</label>
              <select id="judge-event"></select>
            </div>
          </div>

          <div class="judge-rule-box" id="judge-rule-note"></div>

          <div class="judge-rank-board" id="judge-rank-board"></div>

          <div class="filter-row judge-form-grid hidden" id="judge-single-class-row">
            <div class="field-group hidden">
              <label for="judge-grade">학년</label>
              <select id="judge-grade"></select>
            </div>
            <div class="field-group">
              <label for="judge-class">반</label>
              <select id="judge-class"></select>
            </div>
          </div>

          <div class="filter-row judge-form-grid hidden" id="judge-count-row">
            <div class="field-group">
              <label for="judge-count">득점 인원수</label>
              <input type="number" id="judge-count" min="0" max="12" step="1" value="0" />
            </div>
          </div>

          <div class="filter-row judge-form-grid hidden" id="judge-parade-row">
            <div class="field-group">
              <label>입장식 평가</label>
              <div class="judge-choice-group" id="judge-parade-options">
                <label class="judge-check judge-choice">
                  <input type="checkbox" id="judge-parade-best" data-parade-value="best" />
                  <span>우수 학급 선택</span>
                  <strong>100점</strong>
                </label>
                <label class="judge-check judge-choice">
                  <input type="checkbox" id="judge-parade-basic" data-parade-value="basic" checked />
                  <span>기본 점수 선택</span>
                  <strong>50점</strong>
                </label>
              </div>
            </div>
          </div>

          <div class="field-group">
            <label for="judge-memo">메모</label>
            <input type="text" id="judge-memo" placeholder="기록, 특이사항 등" />
          </div>

          <div class="judge-score-panel">
            <div>
              <span>계산 점수</span>
              <strong id="judge-score-value">0</strong>
            </div>
            <button class="btn btn-primary" id="judge-save-btn">점수 저장</button>
          </div>
          <div class="alert alert-info hidden" id="judge-save-status"></div>
        </div>

        <div class="card day-table-card">
          <div class="judge-table-head">
            <strong>입력된 점수</strong>
            <button class="btn btn-secondary btn-sm" id="judge-refresh-scores-btn">새로고침</button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>입력일시</th>
                  <th>종목</th>
                  <th>학급</th>
                  <th>기록</th>
                  <th>점수</th>
                  <th>심판</th>
                </tr>
              </thead>
              <tbody id="judge-score-body"></tbody>
            </table>
            <div id="judge-score-empty" class="table-empty hidden">입력된 점수가 없습니다.</div>
          </div>
        </div>
      </section>

      <div id="day-loading" class="table-loading">데이터를 불러오는 중...</div>
    </main>
  </div>

  <div id="judge-login-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2>심판 로그인</h2>
      <p class="overlay-sub">심판 비밀번호와 이름을 입력해주세요.</p>
      <div class="field-group">
        <label for="judge-name">심판 이름</label>
        <input type="text" id="judge-name" placeholder="예: 홍길동" />
      </div>
      <div class="field-group">
        <label for="judge-password">비밀번호</label>
        <input type="password" id="judge-password" placeholder="심판 비밀번호 입력" />
        <span class="field-error" id="judge-login-error"></span>
      </div>
      <button class="btn btn-primary" id="judge-login-btn">로그인</button>
      <button class="btn btn-outline" id="judge-login-cancel-btn" style="width:100%; margin-top:0.5rem;">취소</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/day.js"></script>
</body>
</html>
